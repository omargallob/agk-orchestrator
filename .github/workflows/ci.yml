name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/docs/**'

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel (with caching)
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build (nogo runs inside the build)
        run: bazel build //...

  lint:
    name: lint
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel (with caching)
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # golangci-lint typechecks with the host Go toolchain; match go.mod.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint Go (golangci-lint via Bazel)
        run: bazel run //tools/lint:golangci-lint -- run

      - name: Lint BUILD files (buildifier)
        run: bazel run //:buildifier.check

      - name: Check BUILD files are up to date (gazelle)
        run: bazel run //:gazelle -- -mode=diff

  coverage:
    name: coverage
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel (with caching)
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # Runs the full test suite and collects Go coverage.
      - name: Coverage (bazel coverage)
        run: bazel coverage //... --combined_report=lcov

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-linux-amd64
          path: bazel-out/_coverage/_coverage_report.dat
          if-no-files-found: error

      - name: Upload to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: bazel-out/_coverage/_coverage_report.dat
          flags: unittests
          fail_ci_if_error: true
          verbose: true
          use_oidc: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
